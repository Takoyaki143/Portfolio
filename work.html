<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳情 - Skat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151515;
            --bg-hover: #1f1f1f;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .back-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* Work Header */
        .work-header {
            margin-bottom: 3rem;
        }

        .work-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .work-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .meta-tag {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .work-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 800px;
        }

        /* Media Section */
        .media-section {
            margin-bottom: 3rem;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: var(--bg-secondary);
            margin-bottom: 2rem;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .image-gallery {
            display: grid;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .gallery-image {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .gallery-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Grid Gallery Styles */
        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .grid-gallery.cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-gallery.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-gallery.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .grid-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lightbox-nav.prev {
            left: 2rem;
        }

        .lightbox-nav.next {
            right: 2rem;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Carousel Styles */
        .carousel-container {
            position: relative;
            margin-bottom: 3rem;
        }

        .carousel-wrapper {
            overflow: hidden;
            border-radius: 12px;
            background: var(--bg-secondary);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s ease;
        }

        .carousel-slide {
            min-width: 50%;
            position: relative;
        }

        .carousel-slide img {
            width: 50%;
            height: auto;
            display: block;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background 0.3s;
            z-index: 10;
        }

        .carousel-nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .carousel-nav.prev {
            left: 1rem;
        }

        .carousel-nav.next {
            right: 1rem;
        }

        .carousel-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            padding: 0;
        }

        .carousel-dot.active {
            background: var(--text-primary);
        }

        .carousel-counter {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Details Section */
        .details-section {
            margin-top: 4rem;
            padding-top: 3rem;
            border-top: 1px solid var(--border);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .detail-item h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .detail-item p {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .tech-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tech-tag {
            padding: 0.4rem 0.8rem;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .error {
            text-align: center;
            padding: 4rem 2rem;
        }

        .error h2 {
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .error p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .error a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .error a:hover {
            background: var(--accent-hover);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-image {
                height: 400px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .work-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                gap: 1rem;
            }

            .grid-gallery.cols-2,
            .grid-gallery.cols-3,
            .grid-gallery.cols-4 {
                grid-template-columns: 1fr;
            }

            .lightbox-close,
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }

            .lightbox-close {
                top: 1rem;
                right: 1rem;
            }

            .lightbox-nav.prev {
                left: 1rem;
            }

            .lightbox-nav.next {
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">SKAT</a>
            <a href="index.html" class="back-btn">
                <span>←</span>
                <span>返回作品集</span>
            </a>
        </nav>
    </header>

    <div id="content">
        <div class="loading">
            <p>載入中...</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Skat. All rights reserved.</p>
    </footer>

    <script>
        // Get work ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const workId = urlParams.get('id');

        async function loadWorkDetail() {
            try {
                const response = await fetch('works.json');
                const works = await response.json();
                const work = works.find(w => w.id === workId);

                if (!work) {
                    showError('找不到該作品');
                    return;
                }

                displayWork(work);
            } catch (error) {
                console.error('Error loading work:', error);
                showError('載入作品時發生錯誤');
            }
        }

        function displayWork(work) {
            document.title = `${work.title} - Skat`;

            const contentDiv = document.getElementById('content');
            
            // Build media section
            let mediaHTML = '';
            
            // Video
            if (work.video) {
                const videoId = extractVideoId(work.video);
                if (videoId) {
                    mediaHTML += `
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/${videoId}" 
                                    allowfullscreen></iframe>
                        </div>
                    `;
                }
            }

            // Images - support carousel, grid, and gridGallery
            if (work.carouselImages && work.carouselImages.length > 0) {
                mediaHTML += buildCarousel(work.carouselImages, 'carousel-1');
            }

            if (work.gridGallery && work.gridGallery.images && work.gridGallery.images.length > 0) {
                mediaHTML += buildGridGallery(work.gridGallery);
            }

            if (work.images && work.images.length > 0) {
                mediaHTML += '<div class="image-gallery">';
                work.images.forEach(img => {
                    mediaHTML += `
                        <div class="gallery-image">
                            <img src="${img}" alt="${work.title}">
                        </div>
                    `;
                });
                mediaHTML += '</div>';
            }

            // Support multiple carousels
            if (work.additionalCarousels && work.additionalCarousels.length > 0) {
                work.additionalCarousels.forEach((carousel, index) => {
                    if (carousel.title) {
                        mediaHTML += `<h3 style="margin: 2rem 0 1rem; color: var(--text-primary);">${carousel.title}</h3>`;
                    }
                    mediaHTML += buildCarousel(carousel.images, `carousel-${index + 2}`);
                });
            }

            // Build tech tags
            let techTagsHTML = '';
            if (work.technologies && work.technologies.length > 0) {
                techTagsHTML = '<div class="tech-tags">';
                work.technologies.forEach(tech => {
                    techTagsHTML += `<span class="tech-tag">${tech}</span>`;
                });
                techTagsHTML += '</div>';
            }

            // Build details section
            let detailsHTML = '';
            if (work.client || work.year || work.technologies) {
                detailsHTML = `
                    <div class="details-section">
                        <div class="details-grid">
                            ${work.client ? `
                                <div class="detail-item">
                                    <h3>客戶</h3>
                                    <p>${work.client}</p>
                                </div>
                            ` : ''}
                            ${work.year ? `
                                <div class="detail-item">
                                    <h3>年份</h3>
                                    <p>${work.year}</p>
                                </div>
                            ` : ''}
                            ${work.technologies && work.technologies.length > 0 ? `
                                <div class="detail-item">
                                    <h3>使用技術</h3>
                                    ${techTagsHTML}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            contentDiv.innerHTML = `
                <div class="container">
                    <div class="work-header">
                        <h1>${work.title}</h1>
                        <div class="work-meta">
                            <span class="meta-tag">${getCategoryName(work.category)}</span>
                        </div>
                        <p class="work-description">${work.detailedDescription || work.description}</p>
                    </div>
                    
                    <div class="media-section">
                        ${mediaHTML}
                    </div>

                    ${detailsHTML}
                </div>
            `;

            // Initialize all carousels if present
            const carousels = document.querySelectorAll('.carousel-container');
            if (carousels.length > 0) {
                carousels.forEach(carousel => initCarousel(carousel));
            }

            // Initialize lightbox for grid galleries
            const gridGalleries = document.querySelectorAll('.grid-gallery');
            if (gridGalleries.length > 0) {
                initLightbox();
            }
        }

        function buildGridGallery(galleryData) {
            const cols = galleryData.columns || 3;
            const colsClass = cols > 0 ? `cols-${cols}` : '';
            
            let gridHTML = `<div class="grid-gallery ${colsClass}" data-gallery="grid">`;
            
            galleryData.images.forEach((img, index) => {
                gridHTML += `
                    <div class="grid-item" data-index="${index}">
                        <img src="${img}" alt="Gallery image ${index + 1}">
                    </div>
                `;
            });
            
            gridHTML += '</div>';
            return gridHTML;
        }

        function initLightbox() {
            // Create lightbox element
            const lightbox = document.createElement('div');
            lightbox.className = 'lightbox';
            lightbox.innerHTML = `
                <button class="lightbox-close">×</button>
                <button class="lightbox-nav prev">‹</button>
                <button class="lightbox-nav next">›</button>
                <div class="lightbox-content">
                    <img src="" alt="">
                </div>
                <div class="lightbox-counter">
                    <span class="current">1</span> / <span class="total">1</span>
                </div>
            `;
            document.body.appendChild(lightbox);

            const lightboxImg = lightbox.querySelector('.lightbox-content img');
            const closeBtn = lightbox.querySelector('.lightbox-close');
            const prevBtn = lightbox.querySelector('.lightbox-nav.prev');
            const nextBtn = lightbox.querySelector('.lightbox-nav.next');
            const currentEl = lightbox.querySelector('.current');
            const totalEl = lightbox.querySelector('.total');

            let currentGallery = [];
            let currentIndex = 0;

            // Open lightbox
            document.querySelectorAll('.grid-item').forEach(item => {
                item.addEventListener('click', () => {
                    const gallery = item.closest('.grid-gallery');
                    const items = Array.from(gallery.querySelectorAll('.grid-item'));
                    
                    currentGallery = items.map(i => i.querySelector('img').src);
                    currentIndex = parseInt(item.dataset.index);
                    
                    showImage();
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });

            // Close lightbox
            closeBtn.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }

            // Navigation
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    showImage();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentIndex < currentGallery.length - 1) {
                    currentIndex++;
                    showImage();
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--;
                    showImage();
                }
                if (e.key === 'ArrowRight' && currentIndex < currentGallery.length - 1) {
                    currentIndex++;
                    showImage();
                }
            });

            function showImage() {
                lightboxImg.src = currentGallery[currentIndex];
                currentEl.textContent = currentIndex + 1;
                totalEl.textContent = currentGallery.length;
                
                prevBtn.style.display = currentIndex === 0 ? 'none' : 'flex';
                nextBtn.style.display = currentIndex === currentGallery.length - 1 ? 'none' : 'flex';
            }
        }

        function buildCarousel(images, carouselId = 'carousel-1') {
            let slidesHTML = '';
            let dotsHTML = '';
            
            images.forEach((img, index) => {
                slidesHTML += `
                    <div class="carousel-slide">
                        <img src="${img}" alt="Slide ${index + 1}">
                    </div>
                `;
                dotsHTML += `<button class="carousel-dot ${index === 0 ? 'active' : ''}" data-index="${index}"></button>`;
            });

            return `
                <div class="carousel-container" data-carousel-id="${carouselId}">
                    <div class="carousel-wrapper">
                        <div class="carousel-track">
                            ${slidesHTML}
                        </div>
                    </div>
                    <button class="carousel-nav prev" aria-label="Previous">‹</button>
                    <button class="carousel-nav next" aria-label="Next">›</button>
                    <div class="carousel-dots">
                        ${dotsHTML}
                    </div>
                    <div class="carousel-counter">
                        <span class="current-slide">1</span> / <span class="total-slides">${images.length}</span>
                    </div>
                </div>
            `;
        }

        function initCarousel(carouselContainer) {
            const track = carouselContainer.querySelector('.carousel-track');
            const slides = Array.from(track.children);
            const prevBtn = carouselContainer.querySelector('.carousel-nav.prev');
            const nextBtn = carouselContainer.querySelector('.carousel-nav.next');
            const dots = Array.from(carouselContainer.querySelectorAll('.carousel-dot'));
            const currentSlideEl = carouselContainer.querySelector('.current-slide');
            
            let currentIndex = 0;

            function updateCarousel() {
                const slideWidth = slides[0].getBoundingClientRect().width;
                track.style.transform = `translateX(-${currentIndex * slideWidth}px)`;
                
                // Update dots
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentIndex);
                });
                
                // Update counter
                currentSlideEl.textContent = currentIndex + 1;
                
                // Update button states
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === slides.length - 1;
            }

            // Next button
            nextBtn.addEventListener('click', () => {
                if (currentIndex < slides.length - 1) {
                    currentIndex++;
                    updateCarousel();
                }
            });

            // Previous button
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateCarousel();
                }
            });

            // Dots navigation
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateCarousel();
                });
            });

            // Touch swipe support
            let touchStartX = 0;
            let touchEndX = 0;

            track.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });

            track.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                if (touchEndX < touchStartX - 50 && currentIndex < slides.length - 1) {
                    currentIndex++;
                    updateCarousel();
                }
                if (touchEndX > touchStartX + 50 && currentIndex > 0) {
                    currentIndex--;
                    updateCarousel();
                }
            }

            // Initial state
            updateCarousel();
        }

        function extractVideoId(url) {
            // YouTube URL patterns
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/,
                /youtube\.com\/embed\/([^&\s]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            
            return null;
        }

        function getCategoryName(category) {
            const names = {
                'video': '影片',
                '3d': '3D',
                'graphic': '平面設計'
            };
            return names[category] || category;
        }

        function showError(message) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="error">
                    <h2>糟糕！</h2>
                    <p>${message}</p>
                    <a href="index.html">返回首頁</a>
                </div>
            `;
        }

        // Load work on page load
        if (workId) {
            loadWorkDetail();
        } else {
            showError('未指定作品 ID');
        }
    </script>
</body>
</html>
